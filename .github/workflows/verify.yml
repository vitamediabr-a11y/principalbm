name: Verify vertical slice

on:
  push:
    branches:
      - build/initial-crm-slice
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: principalbm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d principalbm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/principalbm?schema=principal
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      APP_TIME_ZONE: America/Belem
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create and commit lockfile when missing
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock npm dependencies"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Install dependencies
        run: npm ci
      - name: Apply runtime role migration to disposable PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909021400_runtime_roles/migration.sql
      - name: Apply application migration to disposable PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909021500_initial_vertical_slice/migration.sql
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Domain and authorization tests
        run: npm run test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Security invariants
        shell: bash
        run: |
          test ! -d .agents
          test ! -d .skills
          ! grep -R --line-number -E 'TEMP_AUTH_BYPASS|password === ["'"']senha123["'"']|fallback-secret|new Map\(' src
          ! grep -R --line-number 'NEXT_PUBLIC_.*SERVICE_ROLE' . --exclude-dir=node_modules --exclude-dir=.next
          test ! -f .env
