name: Foundation browser verification

on:
  push:
    branches:
      - verify/foundation-ui

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: principalbm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d principalbm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/principalbm
      BETTER_AUTH_SECRET: browser-only-secret-not-used-in-production-0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3000
      APP_TIME_ZONE: America/Belem
      BOOTSTRAP_CONFIRM: CREATE_FIRST_OWNER
      BOOTSTRAP_OWNER_EMAIL: qa.owner@example.invalid
      BOOTSTRAP_OWNER_NAME: Proprietário QA
      BOOTSTRAP_OWNER_PASSWORD: DisposableBrowserOnly!2026
      BOOTSTRAP_ORGANIZATION_NAME: Organização QA Descartável
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "CI_CRM_APP_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://crm_app:$password@localhost:5432/principalbm" >> "$GITHUB_ENV"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909021400_runtime_roles/migration.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -v crm_app_password="$password" -f tests/sql/bootstrap-ci-runtime.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909021500_initial_vertical_slice/migration.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909021600_tenant_integrity/migration.sql
      - run: npm run prisma:generate
      - name: Bootstrap disposable Owner
        run: npm run bootstrap:owner
      - name: Seed disposable visual states
        shell: bash
        run: |
          cat > scripts/browser-seed.ts <<'EOF'
          import { prisma } from "../src/lib/prisma";
          const owner = await prisma.membership.findFirstOrThrow({ where: { role: "OWNER", active: true } });
          const customer = await prisma.customer.create({ data: {
            organizationId: owner.organizationId,
            responsibleMembershipId: owner.id,
            name: "Maria da Conceição Albuquerque de Souza — Cliente com nome propositalmente longo",
            whatsapp: "(11) 99876-5432", whatsappNormalized: "11998765432",
            email: "maria.qa@example.invalid", city: "Belém", source: "PHYSICAL_STORE", status: "RECURRING",
            notes: "Cadastro descartável usado somente para inspeção visual em CI."
          }});
          const child1 = await prisma.child.create({ data: { customerId: customer.id, name: "Ana Clara", birthDate: new Date("2024-02-10T12:00:00Z"), currentSize: "M", preferences: "Algodão e cores neutras" } });
          await prisma.child.create({ data: { customerId: customer.id, name: "João Miguel com um nome infantil também bastante comprido", birthDate: new Date("2022-05-18T12:00:00Z"), currentSize: "4" } });
          await prisma.pregnancy.create({ data: { customerId: customer.id, expectedDueDate: new Date("2024-02-15T12:00:00Z"), babyName: "Ana Clara", status: "COMPLETED", confirmedBirthDate: new Date("2024-02-10T12:00:00Z"), confirmedChildId: child1.id } });
          await prisma.pregnancy.create({ data: { customerId: customer.id, expectedDueDate: new Date("2026-09-01T12:00:00Z"), babyName: "Bebê em acompanhamento", status: "ACTIVE", reportedPregnancyMonth: 9 } });
          console.log(`CUSTOMER_ID=${customer.id}`);
          await prisma.$disconnect();
          EOF
          output="$(npx tsx scripts/browser-seed.ts)"
          echo "$output"
          echo "$output" | grep '^CUSTOMER_ID=' >> "$GITHUB_ENV"
          rm scripts/browser-seed.ts
      - name: Build real application
        run: npm run build
      - name: Install browser runtime
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        shell: bash
        run: |
          npm start > /tmp/principal-app.log 2>&1 &
          echo $! > /tmp/principal-app.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/principal-app.log
          exit 1
      - name: Inspect UI in Chromium
        shell: bash
        run: |
          mkdir -p ui-artifacts/screenshots
          cat > scripts/browser-verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base = 'http://127.0.0.1:3000';
          const widths = [320, 375, 390, 430, 1280];
          const report = { generatedAt: new Date().toISOString(), pages: [], dialogCaptures: [], login: {}, notes: [] };
          const browser = await chromium.launch({ headless: true });

          async function inspect(page, label, width, route) {
            await page.goto(base + route, { waitUntil: 'networkidle' });
            const metrics = await page.evaluate(() => {
              const root = document.documentElement;
              const interactive = [...document.querySelectorAll('button,a[href],input,select,textarea,[role="button"]')]
                .filter(el => {
                  const s = getComputedStyle(el); const r = el.getBoundingClientRect();
                  return s.visibility !== 'hidden' && s.display !== 'none' && r.width > 0 && r.height > 0;
                }).map(el => {
                  const r = el.getBoundingClientRect();
                  return { tag: el.tagName, text: (el.getAttribute('aria-label') || el.textContent || el.getAttribute('placeholder') || '').trim().replace(/\s+/g,' ').slice(0,80), width: Math.round(r.width), height: Math.round(r.height) };
                });
              const tooSmall = interactive.filter(x => x.width < 44 || x.height < 44);
              const text = document.body.innerText;
              const englishLeak = [...new Set((text.match(/\b(Save|Cancel|Edit|Search|Customer|Customers|Children|Pregnancy|Birth|Loading|Error|Empty|Submit|Delete)\b/g) || []))];
              const fixed = [...document.querySelectorAll('*')].filter(el => ['fixed','sticky'].includes(getComputedStyle(el).position)).map(el => { const r=el.getBoundingClientRect(); return { text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,80), left:Math.round(r.left), right:Math.round(r.right), top:Math.round(r.top), bottom:Math.round(r.bottom) }; });
              return { viewport: innerWidth, scrollWidth: root.scrollWidth, overflowX: root.scrollWidth > innerWidth + 1, interactiveCount: interactive.length, tooSmall, englishLeak, fixed, title: document.title, h1: document.querySelector('h1')?.textContent?.trim() || null, buttons: [...document.querySelectorAll('button')].map(x => (x.textContent||'').trim()).filter(Boolean) };
            });
            const file = `ui-artifacts/screenshots/${String(width)}-${label}.png`;
            await page.screenshot({ path: file, fullPage: true });
            report.pages.push({ label, width, route, ...metrics, screenshot: file });
          }

          // login page at every required viewport, including focused inputs
          for (const width of widths) {
            const ctx = await browser.newContext({ viewport: { width, height: width === 1280 ? 800 : 844 }, isMobile: width < 600, hasTouch: width < 600 });
            const p = await ctx.newPage();
            await inspect(p, 'login', width, '/login');
            const email = p.getByLabel('E-mail');
            if (await email.count()) { await email.focus(); report.login[`focus-${width}`] = await email.evaluate(el => ({ type: el.type, inputMode: el.inputMode, autocomplete: el.autocomplete, focused: document.activeElement === el })); }
            await ctx.close();
          }

          const ctx = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
          const page = await ctx.newPage();
          await page.goto(base + '/login', { waitUntil: 'networkidle' });
          await page.getByLabel('E-mail').fill(process.env.BOOTSTRAP_OWNER_EMAIL);
          await page.getByLabel('Senha').fill(process.env.BOOTSTRAP_OWNER_PASSWORD);
          await page.getByRole('button', { name: 'Entrar' }).click();
          await page.waitForURL('**/clientes', { timeout: 15000 });
          report.login.success = true;

          const id = process.env.CUSTOMER_ID;
          const routes = [
            ['clientes', '/clientes'],
            ['novo-cliente', '/clientes/novo'],
            ['cliente-360', `/clientes/${id}`],
            ['editar-cliente', `/clientes/${id}/editar`],
            ['jornada', `/clientes/${id}/jornada`],
            ['criancas', `/clientes/${id}/criancas`]
          ];
          for (const width of widths) {
            await page.setViewportSize({ width, height: width === 1280 ? 800 : 844 });
            for (const [label, route] of routes) await inspect(page, label, width, route);
          }

          // Search/empty-state behavior on real list.
          await page.setViewportSize({ width: 390, height: 844 });
          await page.goto(base + '/clientes', { waitUntil: 'networkidle' });
          const search = page.locator('input[type="search"],input[name="search"],input[placeholder*="Buscar" i]').first();
          if (await search.count()) {
            await search.fill('ZZZ CLIENTE INEXISTENTE ZZZ');
            await search.press('Enter');
            await page.waitForLoadState('networkidle');
            await page.screenshot({ path: 'ui-artifacts/screenshots/390-clientes-busca-vazia.png', fullPage: true });
            report.notes.push({ searchTest: true, url: page.url(), text: (await page.locator('body').innerText()).slice(0,1200) });
          } else report.notes.push({ searchTest: false, reason: 'search input not found' });

          // Open operational dialogs/drawers when present; do not submit destructive actions.
          for (const route of [`/clientes/${id}/jornada`, `/clientes/${id}/criancas`]) {
            await page.goto(base + route, { waitUntil: 'networkidle' });
            for (const pattern of [/adicionar gestação/i,/editar gestação/i,/confirmar nascimento/i,/adicionar criança/i,/editar/i]) {
              const btn = page.getByRole('button', { name: pattern }).first();
              if (await btn.count() && await btn.isVisible().catch(()=>false)) {
                const name = ((await btn.innerText()).trim() || pattern.source).replace(/[^a-zA-Z0-9À-ÿ]+/g,'-').toLowerCase();
                await btn.click(); await page.waitForTimeout(250);
                const dialog = page.locator('[role="dialog"]').first();
                if (await dialog.count() && await dialog.isVisible().catch(()=>false)) {
                  const metrics = await dialog.evaluate(el => { const r=el.getBoundingClientRect(); return { left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height,viewport:innerWidth,overflow: r.left < 0 || r.right > innerWidth }; });
                  const file=`ui-artifacts/screenshots/390-dialog-${name}.png`;
                  await page.screenshot({path:file, fullPage:true});
                  report.dialogCaptures.push({route,name,metrics,screenshot:file,text:(await dialog.innerText()).slice(0,1000)});
                  await page.keyboard.press('Escape'); await page.waitForTimeout(150);
                }
              }
            }
          }

          fs.writeFileSync('ui-artifacts/report.json', JSON.stringify(report, null, 2));
          const failures = report.pages.filter(p => p.overflowX || p.englishLeak.length);
          console.log(JSON.stringify({ pages: report.pages.length, overflowFailures: report.pages.filter(p=>p.overflowX).length, englishLeakPages: report.pages.filter(p=>p.englishLeak.length).length, touchTargetViolations: report.pages.reduce((n,p)=>n+p.tooSmall.length,0), dialogs: report.dialogCaptures.length, failures: failures.map(x=>({label:x.label,width:x.width,overflow:x.overflowX,english:x.englishLeak})) }, null, 2));
          await browser.close();
          EOF
          node scripts/browser-verify.mjs
          rm scripts/browser-verify.mjs
      - name: Show server errors
        if: always()
        shell: bash
        run: |
          grep -E 'Error|ERROR|Unhandled|Exception' /tmp/principal-app.log || true
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-ui-browser-evidence
          path: ui-artifacts
          if-no-files-found: error
          retention-days: 1
