name: Export verified remediation blobs

on:
  push:
    branches:
      - verify/npm-audit-foundation

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproduce verified manifests
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set devDependencies.vitest=4.1.11
          npm pkg set overrides.vitest=4.1.11
          npm pkg set overrides.mysql2=3.23.1
          npm pkg set overrides.deepmerge-ts=8.0.1
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit
      - name: Create unreferenced Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in package.json package-lock.json; do
            jq -Rs '{content: ., encoding: "utf-8"}' "$file" > "/tmp/${file}.json"
            sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input "/tmp/${file}.json" --jq .sha)"
            echo "${file}=${sha}"
          done
