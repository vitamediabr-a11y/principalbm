name: Foundation npm audit

on:
  push:
    branches:
      - verify/npm-audit-foundation

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install committed lockfile
        run: npm ci
      - name: Report installed versions
        shell: bash
        run: |
          npm ls prisma @prisma/config deepmerge-ts mysql2 vitest @vitest/mocker --all || true
      - name: Capture full npm audit JSON
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          code=$?
          set -e
          cat npm-audit.json
          echo "FULL_AUDIT_EXIT_CODE=$code"
          exit 0
      - name: Capture production-only npm audit JSON
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-prod.json
          code=$?
          set -e
          cat npm-audit-prod.json
          echo "PROD_AUDIT_EXIT_CODE=$code"
          exit 0
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
            npm-audit-prod.json
          if-no-files-found: error
          retention-days: 1
