name: Refresh lockfile artifact

on:
  push:
    branches:
      - build/initial-crm-slice
    paths:
      - package.json
      - .github/workflows/refresh-lock.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile without modifying repository
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
