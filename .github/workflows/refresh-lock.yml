name: Refresh lockfile artifact

on:
  push:
    branches:
      - build/initial-crm-slice
    paths:
      - package.json
      - .github/workflows/refresh-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile in disposable checkout
        run: npm install --package-lock-only --ignore-scripts
      - name: Create unreferenced Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -Rs '{content: ., encoding: "utf-8"}' package-lock.json > /tmp/lock-blob.json
          blob_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/lock-blob.json --jq .sha)"
          echo "LOCK_BLOB_SHA=$blob_sha"
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
