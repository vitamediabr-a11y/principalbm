name: Principal BM browser acceptance

on:
  push:
    branches:
      - build/initial-crm-slice
      - build/journey-event-opportunity
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: principalbm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d principalbm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/principalbm
      BETTER_AUTH_URL: http://127.0.0.1:3000
      APP_TIME_ZONE: America/Belem
      BOOTSTRAP_CONFIRM: CREATE_FIRST_OWNER
      BOOTSTRAP_OWNER_EMAIL: qa.owner@example.invalid
      BOOTSTRAP_OWNER_NAME: Proprietário QA
      BOOTSTRAP_ORGANIZATION_NAME: Organização QA Descartável
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate disposable credentials
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 24)"
          owner_password="Qa-$(openssl rand -hex 20)-9!"
          auth_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$owner_password"
          echo "::add-mask::$auth_secret"
          echo "DATABASE_URL=postgresql://crm_app:$db_password@localhost:5432/principalbm" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_OWNER_PASSWORD=$owner_password" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$auth_secret" >> "$GITHUB_ENV"
          echo "CI_CRM_APP_PASSWORD=$db_password" >> "$GITHUB_ENV"
      - name: Prepare disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909021400_runtime_roles/migration.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -v crm_app_password="$CI_CRM_APP_PASSWORD" -f tests/sql/bootstrap-ci-runtime.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909021500_initial_vertical_slice/migration.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909021600_tenant_integrity/migration.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260909143000_journey_event_opportunity/migration.sql
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Bootstrap disposable Owner
        run: npm run bootstrap:owner
      - name: Seed disposable foundation visual states
        shell: bash
        run: |
          output="$(npx tsx tests/e2e/foundation-seed.ts)"
          echo "$output" | grep '^CUSTOMER_ID=' >> "$GITHUB_ENV"
      - name: Seed disposable opportunity visual states
        shell: bash
        run: |
          output="$(npx tsx tests/e2e/opportunity-seed.ts)"
          echo "$output" | grep '^OPPORTUNITY_CUSTOMER_ID=' >> "$GITHUB_ENV"
          echo "$output" | grep '^OPPORTUNITY_OWNER_MEMBERSHIP_ID=' >> "$GITHUB_ENV"
      - name: Production build
        run: npm run build
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production application
        shell: bash
        run: |
          npm start > /tmp/principal-app.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3000/login >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/principal-app.log
          exit 1
      - name: Verify foundation regression matrix in Chromium
        run: node tests/e2e/foundation-browser-acceptance.mjs
      - name: Reset disposable auth rate-limit state between suites
        shell: bash
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DELETE FROM principal.rate_limit;'
      - name: Verify opportunity slice matrix in Chromium
        run: node tests/e2e/opportunity-browser-acceptance.mjs
      - name: Show server errors
        if: always()
        shell: bash
        run: grep -E 'Error|ERROR|Unhandled|Exception' /tmp/principal-app.log || true
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: principal-browser-acceptance
          path: ui-artifacts
          if-no-files-found: error
          retention-days: 2
